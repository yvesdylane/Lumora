[project]
name = "lumora"
version = "0.1.0"
description = "Generative video editor — AI produces editable layers on the same timeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.15.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.0.0",
    "celery>=5.6.3",
    "fastapi>=0.139.2",
    "faster-whisper>=1.2.1",
    "genblaze-core>=0.3.7",
    "genblaze-elevenlabs>=0.1.0",
    "genblaze-gmicloud>=0.1.0",
    "genblaze-google>=0.1.0",
    "genblaze-openai>=0.1.0",
    "genblaze-s3>=0.3.6",
    "genblaze-stability-audio>=0.1.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.51.0",
]
