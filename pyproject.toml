[project]
name = "lumora"
version = "0.1.0"
description = "Generative video editor — AI produces editable layers on the same timeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.139.2",
    "faster-whisper>=1.2.1",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.51.0",
]

[tool.setuptools.packages.find]
include = ["core*", "models*", "routes*", "controllers*", "middlewares*", "utils*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
